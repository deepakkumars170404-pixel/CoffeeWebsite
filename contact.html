<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <style>
    #name{
    color: rgb(211, 78, 7);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    margin-left: -1050px;
}

.navbar{
    background: #fffafa;
background: linear-gradient(0deg, rgba(255, 250, 250, 1) 35%, rgba(247, 127, 15, 1) 100%);
  }


.contact-section{
    background:#f8f8f8;
    font-family: Arial, Helvetica, sans-serif;
}

.contact-title{
    font-size:50px;
    font-weight:700;
    color:#222;
}

.contact-subtitle{
    color:#666;
    font-size:18px;
    margin-top:10px;
}

.contact-info-box{
    background:#ffffff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    height:100%;
}

.contact-info-box h3{
    font-size:32px;
    margin-bottom:30px;
}

.info-item h5{
    font-size:22px;
    margin-bottom:10px;
    color:#111;
}

.info-item p{
    margin:0;
    color:#666;
    font-size:17px;
    
}

.contact-form-box{
    background:#ffffff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.custom-input{
    height:55px;
    border-radius:12px;
    border:1px solid #ddd;
    padding-left:18px;
    font-size:16px;
    
}

textarea.custom-input{
    height:auto;
    padding-top:15px;
}

.custom-input:focus{
    border-color:#8b5e3c;
}

.contact-btn{
    background:#8b5e3c;
    color:#fff;
    border:none;
    padding:14px 35px;
    border-radius:12px;
    font-size:18px;
    
}

.contact-btn:hover{
    background:#6f472a;
}


    </style>
</head>
<body>


    <div class="navbar navbar-expand-md">
        <div class="container">
            <img src="Logo.png" alt="capachinno" style="height: 70px;" width="70px">
            <a href="#" class="navbar-brand"><p id="name">DK CAFENA</p></a>
        </div>
         <button class="navbar-toggler" data-bs-target="#link" data-bs-toggle="collapse" ><p class="navbar-toggler-icon"></p></button>
        <div id="link" class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="Products.html" class="nav-link">Products</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
                <li><a href="locations.html" class="nav-link">Locations</a></li>
                <li><a href="contact.html" class="nav-link">Contact </a></li>
            </ul>
        </div>
       
    </div>

     <div class="container">

        <!-- Heading -->
        <div class="text-center mb-5">
            <h2 class="contact-title">Contact Us</h2>
            <p class="contact-subtitle">
                We'd love to hear from you
            </p>
        </div>

        <div class="row g-4 align-items-center">

            <!-- Left Info -->
            <div class="col-lg-5">

                <div class="contact-info-box">

                    <h3 class="mb-4">Get In Touch</h3>

                    <div class="info-item mb-4">
                        <h5>📍 Address </h5>
                        <p>12 Coffee Street, Sivakasi, Tamil Nadu</p>
                    </div>

                    <div class="info-item mb-4">
                        <h5>📞 Phone </h5>
                        <p>+91 9843173678</p>
                    </div>

                    <div class="info-item mb-4">
                        <h5>📩 Email </h5>
                        <p>dkcafena@gmail.com</p>
                    </div>

                    <div class="info-item">
                        <h5>⏳ Working Hours </h5>
                        <p>Mon - Sun : 8:00 AM - 10:00 PM</p>
                    </div>

                </div>

            </div>

            <!-- Right Form -->
            <div class="col-lg-7">

                <div class="contact-form-box">

                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-4">
                                <input type="text"
                                       class="form-control custom-input"
                                       placeholder="Your Name">
                            </div>

                            <div class="col-md-6 mb-4">
                                <input type="email"
                                       class="form-control custom-input"
                                       placeholder="Your Email">
                            </div>

                        </div>

                        <div class="mb-4">
                            <input type="text"
                                   class="form-control custom-input"
                                   placeholder="Subject">
                        </div>

                        <div class="mb-4">
                            <textarea rows="6"
                                      class="form-control custom-input"
                                      placeholder="Your Message"></textarea>
                        </div>

                        <button type="submit" class="contact-btn">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    
</body>
</html>
